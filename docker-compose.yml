version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: vlu_mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: vlu_enterprise_link
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-prootpassword" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  migrator:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vlu_migrator
    restart: "no"
    env_file:
      - ./backend/.env
    environment:
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD=rootpassword
      - DB_NAME=vlu_enterprise_link
    volumes:
      - ./database.sql:/database.sql:ro
    depends_on:
      db:
        condition: service_healthy
    command: [ "sh", "-c", "node migrations/run-sql.js && node seed.js" ]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vlu_backend_api
    restart: always
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD=rootpassword
      - DB_NAME=vlu_enterprise_link
      - PORT=5000
    depends_on:
      db:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vlu_frontend_ui
    restart: always
    expose:
      - "80"
    depends_on:
      - backend

  caddy:
    image: caddy:latest
    container_name: vlu_caddy_router
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend

volumes:
  db_data:
  caddy_data:
  caddy_config:
